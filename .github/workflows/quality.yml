name: 品質ゲート

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
      - name: Node.js 24を設定
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 固定依存を復元
        run: npm ci
      - name: 製品Packを検証
        run: npm run validate
      - name: 承認候補を検証
        run: npm run validate:candidates
      - name: 静的解析
        run: npm run lint
      - name: 型検査
        run: npm run typecheck
      - name: 単体・DB試験
        run: npm test
      - name: Production build
        run: npm run build
      - name: Chromiumを準備
        run: npx playwright install chromium
      - name: 結合・総合試験
        run: npm run test:e2e
